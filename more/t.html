<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My First Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      text-align: center;
      padding: 60px 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #00f2ff, 0 0 20px #00f2ff;
    }

    p {
      font-size: 1.2em;
      opacity: 0.9;
    }

    button {
      margin-top: 30px;
      padding: 12px 25px;
      font-size: 1em;
      border: none;
      border-radius: 30px;
      background: #00f2ff;
      color: #000;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 0 15px #00f2ff;
    }

    button:hover {
      background: white;
      box-shadow: 0 0 25px white;
    }

    .card {
      margin-top: 50px;
      padding: 20px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      display: inline-block;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <h1>Welcome 🚀</h1>
  <p>This is my first shiny website.</p>

  <button onclick="changeText()">Click Me</button>

  <div class="card">
    <p id="message">Learning HTML is fun!</p>
  </div>

  <script>
    function changeText() {
      document.getElementById("message").textContent =
        "You just used JavaScript 🎉";
    }
  </script>

</body>
</html>
