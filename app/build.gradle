plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'io.github.reactivecircus.app-versioning' version '1.3.1'
}

android {
    namespace 'io.xavatarlabs.atlaskeys'
    compileSdk 35

    defaultConfig {
        applicationId "io.xavatarlabs.atlaskeys"
        minSdk 23
        targetSdk 34

        // versionCode & versionName will be set by the versioning plugin
        versionCode 1
        versionName "1.0"
        // BuildConfig field for date is fine
         buildConfigField "String", "VERSION_DATE", "\"v${new Date().format('yyyy.MM.dd')}\""

        // Safe commit count extraction from versionName at runtime
         buildConfigField "String", "VERSION_SEMANTIC", "\"${versionName}\""
        //buildConfigField "String", "VERSION_COMMITCOUNT", "\"v\" + versionName.split('\\.').last()"
    }

   buildFeatures {
      // Enable BuildConfig generation so custom buildConfigField lines work
      buildConfig = true
      viewBinding = true
      compose = true
      }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    composeOptions {
      kotlinCompilerExtensionVersion '1.5.15'
    }
    
    kotlinOptions {
      jvmTarget = '17'
    }

}

tasks.register("printVersionName") {
    doLast {
        println android.defaultConfig.versionName
    }
}

appVersioning {
    overrideVersionName { gitTag, providers, variantInfo ->
        def parts = gitTag.rawTagName.tokenize('.')
        def major = parts.size() > 0 ? parts[0] : "0"
        def minor = parts.size() > 1 ? parts[1] : "0"
        def patch = gitTag.commitsSinceLatestTag
        return "v${major}.${minor}.${patch}"
    }

    overrideVersionCode { gitTag, providers, variantInfo ->
        def parts = gitTag.rawTagName.tokenize('.')
        def major = (parts.size() > 0 ? parts[0].toInteger() : 0)
        def minor = (parts.size() > 1 ? parts[1].toInteger() : 0)
        def patch = gitTag.commitsSinceLatestTag
        return major * 1000000 + minor * 10000 + patch
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.preference:preference-ktx:1.2.1"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    // Compose BOM (controls versions)
    implementation platform("androidx.compose:compose-bom:2026.01.01")
    //implementation platform("androidx.compose:compose-bom:2026.1.0")
    //implementation platform("androidx.compose:compose-bom:2024.10.01")

    // Core Compose UI
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3:material3"

    debugImplementation "androidx.compose.ui:ui-tooling"
}
